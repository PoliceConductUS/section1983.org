name: Validate

on:
  pull_request:
    types: [opened, synchronize, reopened]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "26.13.1"
          cache: npm

      - run: npm ci

      # The Terraform format and configuration check needs the terraform
      # binary. It reads only the files, so it needs no AWS credentials.
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.17.2"
          terraform_wrapper: false

      # Formatting, lint, type check, and the unit tests. The type check loads
      # the Astro config, which requires the Sentry values; placeholders are
      # enough because nothing is built or sent.
      - name: Validate
        run: npm run validate
        env:
          PUBLIC_SENTRY_DSN: https://public@example.invalid/1
          PUBLIC_SENTRY_ENVIRONMENT: test
